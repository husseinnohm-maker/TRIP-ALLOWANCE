<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Allowance Engine</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- xlsx-js-style for Excel Parsing and Premium Export Formatting -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.min.js"></script>

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #1d4ed8; font-weight: 600; }
        .tab-inactive { color: #64748b; font-weight: 500; }
        .tab-inactive:hover { color: #334155; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, Fragment } = React;

        const Truck = ({size=24, className=""}) => (<svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>);
        const FileSpreadsheet = ({size=24, className=""}) => (<svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="13" x2="16" y2="13"></line><line x1="8" y1="17" x2="16" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>);
        const Settings = ({size=24, className=""}) => (<svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>);
        const ChevronDown = ({size=24, className=""}) => (<svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>);
        const ChevronUp = ({size=24, className=""}) => (<svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>);
        const AlertCircle = ({size=24, className=""}) => (<svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>);
        const Download = ({size=24, className=""}) => (<svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>);
        const Search = ({size=24, className=""}) => (<svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>);
        const LayoutDashboard = ({size=24, className=""}) => (<svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>);
        const List = ({size=24, className=""}) => (<svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>);
        const Activity = ({size=24, className=""}) => (<svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>);

        function App() {
            // File Uploads
            const [ddrFile, setDdrFile] = useState(null);
            const [tmsFile, setTmsFile] = useState(null);
            const [convFile, setConvFile] = useState(null);
            const [palletFile, setPalletFile] = useState(null);
            const [oosFile, setOosFile] = useState(null);
            
            // App State
            const [usePalletFile, setUsePalletFile] = useState(false);
            const [isProcessing, setIsProcessing] = useState(false);
            const [results, setResults] = useState(null);
            const [error, setError] = useState('');
            const [expandedDrivers, setExpandedDrivers] = useState({});
            const [expandedTrucks, setExpandedTrucks] = useState({});
            
            // UI State
            const [showSettings, setShowSettings] = useState(false);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [searchTerm, setSearchTerm] = useState('');
            const [settingsTab, setSettingsTab] = useState('general');

            // Core Allowance Settings
            const [settings, setSettings] = useState({
                localCities: 'Riyadh, Buraidah, Buraida, Jeddah, Khobar, Madinah, Khamis',
                upcountryDefaultRate: 0,
                rateUnder700: 0.6,
                rateOver700: 50,
                palletRate: 8,
                otherTripRate: 30,
                secondTrip5t: 50,
                secondTrip7t10t: 75,
                secondTrip20t: 100
            });

            // Dynamic Rates & Discovered Destinations
            const [upcountryRates, setUpcountryRates] = useState({});
            const [discoveredDests, setDiscoveredDests] = useState([]);
            
            // New Out of Scope / E-Invoice Rates
            const [oosRates, setOosRates] = useState({});
            const [einvoiceRates, setEinvoiceRates] = useState({});
            const [discoveredOOSDests, setDiscoveredOOSDests] = useState([]);
            const [discoveredEInvoiceDests, setDiscoveredEInvoiceDests] = useState([]);

            const handleSettingChange = (e) => {
                const { name, value } = e.target;
                setSettings(prev => ({ ...prev, [name]: name === 'localCities' ? value : parseFloat(value) || 0 }));
            };

            const handleUpcountryRateChange = (dest, value) => {
                setUpcountryRates(prev => ({ ...prev, [dest]: parseFloat(value) || 0 }));
            };
            
            const handleOosRateChange = (dest, value) => {
                setOosRates(prev => ({ ...prev, [dest]: parseFloat(value) || 0 }));
            };
            
            const handleEinvoiceRateChange = (dest, value) => {
                setEinvoiceRates(prev => ({ ...prev, [dest]: parseFloat(value) || 0 }));
            };

            const toggleDriver = (driverId) => {
                setExpandedDrivers(prev => ({ ...prev, [driverId]: !prev[driverId] }));
            };

            const toggleTruck = (truckId) => {
                setExpandedTrucks(prev => ({ ...prev, [truckId]: !prev[truckId] }));
            };

            const formatDateStr = (val) => {
                if (!val) return '';
                
                // Handle native Excel Serial Numbers mathematically to completely avoid timezone drift
                if (typeof val === 'number') {
                    // Excel epoch starts on Jan 1, 1900.
                    // 25569 is the difference in days between 1900-01-01 and 1970-01-01 (Unix Epoch)
                    const unixTimestampInMs = (val - 25569) * 86400 * 1000;
                    // Add 12 hours (43200000 ms) to force the time to NOON UTC, avoiding any midnight timezone rollbacks
                    const d = new Date(unixTimestampInMs + 43200000); 
                    const y = d.getUTCFullYear();
                    const m = String(d.getUTCMonth() + 1).padStart(2, '0');
                    const day = String(d.getUTCDate()).padStart(2, '0');
                    return `${y}-${m}-${day}`;
                }

                if (val instanceof Date) {
                    // Force to NOON locally before extracting to avoid timezone shift pushing it back a day
                    const safeDate = new Date(val.getTime() + (12 * 60 * 60 * 1000));
                    const y = safeDate.getFullYear();
                    const m = String(safeDate.getMonth() + 1).padStart(2, '0');
                    const d = String(safeDate.getDate()).padStart(2, '0');
                    return `${y}-${m}-${d}`;
                }
                const strVal = String(val).trim();
                
                // Handle formats like DD/MM/YYYY or DD-MM-YYYY
                const parts = strVal.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);
                if (parts) {
                    let m = parseInt(parts[2], 10);
                    let d = parseInt(parts[1], 10);
                    if (m > 12) { const tmp = m; m = d; d = tmp; }
                    return `${parts[3]}-${m.toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
                }

                // Match YYYY-MM-DD strictly
                const isoParts = strVal.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
                if (isoParts) {
                    return `${isoParts[1]}-${isoParts[2].padStart(2,'0')}-${isoParts[3].padStart(2,'0')}`;
                }

                const monthMap = { 'jan': 1, 'feb': 2, 'mar': 3, 'apr': 4, 'may': 5, 'jun': 6, 'jul': 7, 'aug': 8, 'sep': 9, 'oct': 10, 'nov': 11, 'dec': 12 };
                const strParts = strVal.split(/[-/ ]/);
                if (strParts.length === 3) {
                    const d = parseInt(strParts[0], 10);
                    const mStr = strParts[1].toLowerCase().substring(0,3);
                    const m = monthMap[mStr];
                    let y = parseInt(strParts[2], 10);
                    
                    if (m && !isNaN(d) && !isNaN(y)) {
                        if (y < 100) y += 2000;
                        return `${y}-${m.toString().padStart(2, '0')}-${d.toString().padStart(2, '0')}`;
                    }
                }

                const parsed = new Date(strVal);
                if (!isNaN(parsed.getTime())) {
                    const py = parsed.getFullYear();
                    const pm = String(parsed.getMonth() + 1).padStart(2, '0');
                    const pd = String(parsed.getDate()).padStart(2, '0');
                    return `${py}-${pm}-${pd}`;
                }
                return strVal.split(' ')[0];
            };

            const parseExcelFile = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const data = new Uint8Array(e.target.result);
                            // Removed cellDates: true. We want raw values (numbers) for dates so we can mathematically convert them without browser timezone interference.
                            const workbook = window.XLSX.read(data, { type: 'array' });
                            const firstSheetName = workbook.SheetNames[0];
                            const firstSheet = workbook.Sheets[firstSheetName];
                            const jsonData = window.XLSX.utils.sheet_to_json(firstSheet, { defval: "" });
                            resolve(jsonData);
                        } catch (err) {
                            reject(err);
                        }
                    };
                    reader.onerror = (err) => reject(err);
                    reader.readAsArrayBuffer(file);
                });
            };
            
            // Parses Excel assigning column letters (A, B, C...) as keys
            const parseExcelFileWithLetters = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const data = new Uint8Array(e.target.result);
                            const workbook = window.XLSX.read(data, { type: 'array' });
                            const firstSheetName = workbook.SheetNames[0];
                            const firstSheet = workbook.Sheets[firstSheetName];
                            const jsonData = window.XLSX.utils.sheet_to_json(firstSheet, { header: "A", defval: "" });
                            resolve(jsonData);
                        } catch (err) {
                            reject(err);
                        }
                    };
                    reader.onerror = (err) => reject(err);
                    reader.readAsArrayBuffer(file);
                });
            };

            const normalizeRow = (row, source) => {
                // Fixed getVal logic: Now uses a two-pass strict search.
                // It ensures exact header matches (like "Order no" and "Zone") are prioritized 
                // preventing "Order ID" from being accidentally captured when searching for "Order no".
                const getVal = (possibleKeys) => {
                    // Pass 1: Strict Exact Match based on the order of possibleKeys
                    for (const pk of possibleKeys) {
                        const key = Object.keys(row).find(k => {
                            const norm = k.toLowerCase().trim().replace(/[_\-]/g, ' ');
                            return norm === pk;
                        });
                        if (key !== undefined) return row[key];
                    }
                    // Pass 2: Partial Match Fallback
                    for (const pk of possibleKeys) {
                        const key = Object.keys(row).find(k => {
                            const norm = k.toLowerCase().trim().replace(/[_\-]/g, ' ');
                            return norm.includes(pk);
                        });
                        if (key !== undefined) return row[key];
                    }
                    return '';
                };

                const driverId = String(getVal(['driver id', 'drivercode', 'driver code', 'driver #', 'emp id', 'employee id']) || '').trim();
                const driverName = String(getVal(['driver name', 'name', 'employee name', 'driver']) || '').trim();
                const tripId = String(getVal(['trip id', 'trip no', 'trip card', 'shipment id', 'shipment', 'route id', 'route']) || '').trim();
                const orderNo = String(getVal(['order number', 'order no', 'order id', 'delivery no', 'delivery number', 'delivery', 'sales order', 'so number']) || '').trim();
                const invoiceNo = String(getVal(['invoice number', 'invoice no', 'invoice', 'inv number', 'inv']) || '').trim();
                const siteRef = String(getVal(['warehouse', 'current branch', 'site reference', 'site ref', 'site', 'branch', 'wh', 'plant', 'dc']) || '').trim().toUpperCase();
                
                const dateRaw = getVal(['plan date', 'date', 'actual receiveing date', 'ship date', 'delivery date', 'creation date', 'trip date']);
                const date = formatDateStr(dateRaw);
                
                const dest = getVal(['destination city', 'destination', 'city', 'ship to city', 'shipto city']);
                const cityDesc = getVal(['city description', 'city discreption', 'region', 'area', 'zone']);

                const qty = parseFloat(getVal(['adj qty', 'manual qty', 'quantity', 'qty', 'delivered qty', 'gross qty', 'cases', 'total cases', 'delivery qty', 'case qty'])) || 0;
                
                const retCases = parseFloat(getVal(['returned no cases', 'return cases', 'returned cases', 'return qty', 'returned'])) || 0;
                const partialRetCases = parseFloat(getVal(['partial return', 'partial qty', 'partial'])) || 0;
                
                const palletsDispatched = parseFloat(getVal(['no of pallets', 'pallets', 'dispatched pallets', 'pallet qty'])) || 0;

                const vehicleType = getVal(['vehicle type', 'truck type', 'truck', 'asset type', 'equipment', 'equipment type']);
                const vehicleNo = getVal(['plate number', 'vehicle number', 'truck number', 'plate no', 'plate', 'truck #']);
                
                let status = '';
                if (source === 'DDR') {
                    status = getVal(['status']); 
                } else {
                    status = getVal(['status', 'pod status']);
                }
                
                const orderType = getVal(['order type', 'type', 'trx type']) || '';

                let isValid = true;
                const sStr = String(status).toLowerCase();
                
                if (source === 'DDR') {
                    if (sStr === 'cancelled') isValid = false;
                } else if (source === 'TMS') {
                    if (!sStr.includes('deliver') && !sStr.includes('return')) isValid = false;
                    if (sStr.includes('cancel') || sStr.includes('assign')) isValid = false;
                }

                const orderTypeStr = String(orderType).toLowerCase();
                const isOther = ['str', 'cross dock', 'rtv', 'gcn'].some(k => orderTypeStr.includes(k) || sStr.includes(k));

                let tonnage = 7;
                const vStr = String(vehicleType).toLowerCase();
                if (vStr.includes('20') || vStr.includes('trailer') || vStr.includes('hd 170')) tonnage = 20;
                else if (vStr.includes('10')) tonnage = 10;
                else if (vStr.includes('7') || vStr.includes('hd 78') || vStr.includes('hd 72')) tonnage = 7;
                else if (vStr.includes('5') || vStr.includes('dyna')) tonnage = 5;

                return {
                    isValid, source, driverId, driverName, tripId, orderNo, invoiceNo, siteRef, date, 
                    dest, cityDesc, qty, originalQty: qty, retCases, partialRetCases, totalRet: retCases + partialRetCases,
                    palletsDispatched, vehicleType, vehicleNo, tonnage, isOther, status: String(status) || 'Processed'
                };
            };

            const processData = async () => {
                if (!ddrFile && !tmsFile && !oosFile) {
                    setError('Please upload at least one main file (DDR, TMS, or Out of Scope) to proceed.');
                    return;
                }
                if (!window.XLSX) {
                    setError('Excel library not loaded. Check internet connection.');
                    return;
                }

                setIsProcessing(true);
                setError('');

                try {
                    let allRows = [];
                    
                    if (ddrFile) {
                        const ddrData = await parseExcelFile(ddrFile);
                        allRows = allRows.concat(ddrData.map(r => normalizeRow(r, 'DDR')).filter(r => r.isValid && r.driverId));
                    }
                    if (tmsFile) {
                        const tmsData = await parseExcelFile(tmsFile);
                        allRows = allRows.concat(tmsData.map(r => normalizeRow(r, 'TMS')).filter(r => r.isValid && r.driverId));
                    }
                    
                    if (oosFile) {
                        const rawOosData = await parseExcelFileWithLetters(oosFile);
                        
                        // Extract Header Row for Fuzzy Driver Mapping
                        const headerRow = rawOosData[0] || {};
                        const driverIdCol = Object.keys(headerRow).find(k => String(headerRow[k]).toLowerCase().includes('driver id') || String(headerRow[k]).toLowerCase().includes('emp id'));
                        const driverNameCol = Object.keys(headerRow).find(k => String(headerRow[k]).toLowerCase().includes('driver name') || String(headerRow[k]).toLowerCase().includes('employee name'));

                        // Filter out empty rows and header row
                        const dataRows = rawOosData.filter((r, idx) => {
                            if (idx === 0) return false;
                            if (String(r['D']).toLowerCase().includes('date') || String(r['K']).toLowerCase().includes('waybill')) return false;
                            return Object.keys(r).length > 0;
                        });

                        const oosProcessed = dataRows.map(row => {
                            const siteRef = String(row['A'] || '').trim().toUpperCase();
                            const orderType = String(row['E'] || '').trim();
                            const orderTypeUpper = orderType.toUpperCase();
                            
                            let dest = '';
                            let oosType = orderType || 'Unknown'; // Capture the exact order type natively from Column E
                            
                            // Map destinations based on Order Type
                            if (orderTypeUpper.includes('STR') || orderTypeUpper.includes('CROSS') || orderTypeUpper.includes('DOCK')) {
                                dest = String(row['B'] || '').trim();
                            } else if (orderTypeUpper.includes('E-INV') || orderTypeUpper.includes('EINVOICE') || orderTypeUpper.includes('E INVOICE')) {
                                dest = String(row['J'] || '').trim();
                            } else {
                                dest = String(row['B'] || row['J'] || '').trim();
                            }

                            const dateRaw = row['D'];
                            const date = formatDateStr(dateRaw);
                            const orderNo = String(row['F'] || '').trim();
                            const invoiceNo = String(row['G'] || '').trim(); // Added column G for Invoice Number
                            const tripId = String(row['K'] || '').trim();
                            const qty = parseFloat(row['L']) || 0;
                            const vehicleType = String(row['O'] || '').trim();
                            const vehicleNo = String(row['P'] || '').trim();

                            let driverId = driverIdCol ? String(row[driverIdCol] || '').trim() : '';
                            let driverName = driverNameCol ? String(row[driverNameCol] || '').trim() : '';
                            
                            // Fallback pseudo-driver if no driver mapping found but we still want to calculate truck/trip metrics
                            if (!driverId) {
                                driverId = `OOS_${vehicleNo || tripId || 'UNKNOWN'}`;
                                driverName = `OOS Driver (${vehicleNo || tripId})`;
                            }

                            let tonnage = 7;
                            const vStr = String(vehicleType).toLowerCase();
                            if (vStr.includes('20') || vStr.includes('trailer') || vStr.includes('hd 170')) tonnage = 20;
                            else if (vStr.includes('10')) tonnage = 10;
                            else if (vStr.includes('7') || vStr.includes('hd 78') || vStr.includes('hd 72')) tonnage = 7;
                            else if (vStr.includes('5') || vStr.includes('dyna')) tonnage = 5;

                            return {
                                isValid: true, source: 'OOS', driverId, driverName, tripId, orderNo, invoiceNo, siteRef, date,
                                dest, cityDesc: '', qty, originalQty: qty, retCases: 0, partialRetCases: 0, totalRet: 0,
                                palletsDispatched: 0, vehicleType, vehicleNo, tonnage, isOther: false, status: 'OOS Delivered',
                                oosType
                            };
                        });
                        
                        allRows = allRows.concat(oosProcessed);
                    }

                    let convTotals = {};
                    if (convFile) {
                        const rawConvData = await parseExcelFile(convFile);
                        rawConvData.forEach(row => {
                            const getVal = (possibleKeys) => {
                                const key = Object.keys(row).find(k => possibleKeys.some(pk => k.toLowerCase().trim() === pk.toLowerCase()));
                                return key ? String(row[key]).trim() : '';
                            };
                            
                            const o = getVal(['order number', 'order no', 'order id', 'delivery', 'delivery no', 'delivery number']);
                            const i = getVal(['invoice number', 'invoice no']);
                            const s = String(getVal(['site reference', 'site ref', 'site', 'branch', 'warehouse', 'wh'])).toUpperCase().trim();
                            const qty = parseFloat(getVal(['cases', 'case qty', 'qty', 'quantity', 'converted qty', 'total cases'])) || 0;
                            
                            const keys = [];
                            if (o && s) keys.push(`O:${o}_S:${s}`);
                            if (i && s) keys.push(`I:${i}_S:${s}`);
                            
                            keys.forEach(k => {
                                if (convTotals[k] === undefined) convTotals[k] = 0;
                                convTotals[k] += qty;
                            });
                        });
                    }

                    let manualPallets = [];
                    if (usePalletFile && palletFile) {
                        const rawPalletData = await parseExcelFile(palletFile);
                        rawPalletData.forEach(row => {
                            const getVal = (possibleKeys) => {
                                const key = Object.keys(row).find(k => {
                                    const norm = k.toLowerCase().trim();
                                    return possibleKeys.some(pk => norm === pk.toLowerCase() || norm.includes(pk.toLowerCase()));
                                });
                                return key !== undefined ? row[key] : '';
                            };
                            
                            const dateRaw = getVal(['date', 'trip date', 'return date', 'date of return', 'plan date']);
                            const date = formatDateStr(dateRaw);
                            
                            const truckRaw = getVal(['truck #', 'truck', 'truck no', 'vehicle', 'plate', 'vehicle type']);
                            const truckDigits = String(truckRaw).replace(/\D/g, ''); 
                            
                            const tripRaw = getVal(['trip id', 'trip', 'shipment', 'trip no']);
                            const tripDigits = String(tripRaw).replace(/\D/g, ''); 
                            
                            const qty = parseFloat(getVal(['good pallets return', 'good', 'good pallets', 'good pallet', 'pallets', 'qty', 'return', 'empty', 'returned cases', 'returned'])) || 0;
                            
                            if (qty > 0 && date && (truckDigits || tripDigits)) {
                                manualPallets.push({ date, truckDigits, tripDigits, qty });
                            }
                        });
                    }

                    const cityClassificationMap = {};
                    allRows.forEach(r => {
                        if (r.source === 'DDR' && r.dest && r.cityDesc) {
                            const dLow = String(r.dest).trim().toLowerCase();
                            const cDescLow = String(r.cityDesc).toLowerCase();
                            if (cDescLow.includes('local')) cityClassificationMap[dLow] = 'local';
                            else if (cDescLow.includes('upcountry') || cDescLow.includes('up country')) cityClassificationMap[dLow] = 'upcountry';
                        }
                    });

                    const getHomeCityFromSite = (siteCode) => {
                        const s = String(siteCode).toUpperCase();
                        if (s.includes('QW1') || s.includes('JW1')) return 'JEDDAH';
                        if (s.includes('RW1') || s.includes('RW2')) return 'RIYADH';
                        if (s.includes('AW1') || s.includes('AW2')) return 'KHOBAR';
                        if (s.includes('BW1')) return 'BURAIDAH';
                        if (s.includes('KW1')) return 'KHAMIS';
                        if (s.includes('MW1')) return 'MADINAH';
                        return null; 
                    };

                    const rowsByOrder = {};
                    allRows.forEach(r => {
                        const groupKey = r.orderNo || r.invoiceNo;
                        if (groupKey) {
                            const key = `${r.source}_${groupKey}`;
                            if (!rowsByOrder[key]) rowsByOrder[key] = [];
                            rowsByOrder[key].push(r);
                        }
                    });

                    Object.values(rowsByOrder).forEach(group => {
                        if (group.length > 0) {
                            const firstRow = group[0];
                            const o = firstRow.orderNo;
                            const i = firstRow.invoiceNo;
                            const s = String(firstRow.siteRef || '').toUpperCase().trim();
                            
                            let trueTotalQty = null;
                            if (o && s && convTotals[`O:${o}_S:${s}`] !== undefined) trueTotalQty = convTotals[`O:${o}_S:${s}`];
                            else if (i && s && convTotals[`I:${i}_S:${s}`] !== undefined) trueTotalQty = convTotals[`I:${i}_S:${s}`];

                            if (trueTotalQty !== null) {
                                const splitQty = trueTotalQty / group.length;
                                group.forEach(r => {
                                    r.qty = splitQty;
                                    if (group.every(x => x.retCases === group[0].retCases)) r.retCases /= group.length;
                                    if (group.every(x => x.partialRetCases === group[0].partialRetCases)) r.partialRetCases /= group.length;
                                    r.totalRet = r.retCases + r.partialRetCases;
                                });
                            } else if (group.length > 1) {
                                const firstQty = group[0].qty;
                                const allSameQty = group.every(r => r.qty === firstQty);
                                if (allSameQty && firstQty > 0) {
                                    group.forEach(r => {
                                        r.qty = r.qty / group.length;
                                        if (group.every(x => x.retCases === group[0].retCases)) r.retCases /= group.length;
                                        if (group.every(x => x.partialRetCases === group[0].partialRetCases)) r.partialRetCases /= group.length;
                                        r.totalRet = r.retCases + r.partialRetCases;
                                    });
                                }
                            }
                        }
                    });

                    const tripsMap = {};
                    allRows.forEach(r => {
                        const identifier = r.tripId || r.orderNo || `unknown_${Math.random()}`;
                        const truckKey = r.vehicleNo || r.vehicleType || 'UnknownTruck';
                        
                        // Link standalone OOS lines to actual drivers if tripId matches an existing DDR/TMS row
                        // Otherwise, group by whatever driverId we generated for OOS.
                        const consolidatedKey = `${r.date}_${truckKey}_${identifier}`;
                        
                        if (!tripsMap[consolidatedKey]) {
                            tripsMap[consolidatedKey] = { ...r, qty: 0, retCases: 0, partialRetCases: 0, totalRet: 0, palletsDispatched: 0, palletsReturned: 0, destinations: [] };
                        }
                        
                        // If current row is DDR/TMS (has valid driver) and existing map has OOS pseudo-driver, inherit real driver
                        if (r.source !== 'OOS' && r.driverId && !r.driverId.startsWith('OOS_')) {
                            tripsMap[consolidatedKey].driverId = r.driverId;
                            tripsMap[consolidatedKey].driverName = r.driverName;
                        }
                        
                        tripsMap[consolidatedKey].qty += r.qty;
                        tripsMap[consolidatedKey].retCases += r.retCases;
                        tripsMap[consolidatedKey].partialRetCases += r.partialRetCases;
                        tripsMap[consolidatedKey].totalRet += r.totalRet;
                        tripsMap[consolidatedKey].palletsDispatched += r.palletsDispatched;
                        
                        if (r.isOther) tripsMap[consolidatedKey].isOther = true;
                        
                        // Preserve OOS Type if it comes from the OOS sheet
                        if (r.oosType) tripsMap[consolidatedKey].oosType = r.oosType;
                        
                        if (r.cityDesc) {
                            const cDesc = String(r.cityDesc).toLowerCase();
                            if (cDesc.includes('upcountry') || cDesc.includes('up country')) {
                                tripsMap[consolidatedKey].cityDesc = 'upcountry';
                            } else if (!tripsMap[consolidatedKey].cityDesc && cDesc.includes('local')) {
                                tripsMap[consolidatedKey].cityDesc = 'local';
                            }
                        }
                        
                        const currentDest = String(r.dest).trim();
                        if (currentDest && !tripsMap[consolidatedKey].destinations.includes(currentDest)) {
                            tripsMap[consolidatedKey].destinations.push(currentDest);
                        }
                    });

                    if (usePalletFile && palletFile) {
                        const allTrips = Object.values(tripsMap);
                        manualPallets.forEach(mp => {
                            let matchedTrip = null;
                            if (mp.tripDigits) matchedTrip = allTrips.find(t => t.tripId && String(t.tripId).replace(/\D/g, '').endsWith(mp.tripDigits));
                            if (!matchedTrip && mp.truckDigits && mp.date) {
                                matchedTrip = allTrips.find(t => t.date === mp.date && 
                                    ((t.vehicleNo && String(t.vehicleNo).replace(/\D/g, '').includes(mp.truckDigits)) || 
                                     (t.vehicleType && String(t.vehicleType).replace(/\D/g, '').includes(mp.truckDigits)))
                                );
                            }
                            if (matchedTrip) matchedTrip.palletsReturned += mp.qty;
                        });
                    }

                    const driverMap = {};
                    Object.values(tripsMap).forEach(t => {
                        if (!driverMap[t.driverId]) driverMap[t.driverId] = { driverId: t.driverId, driverName: t.driverName, dates: {} };
                        if (!driverMap[t.driverId].dates[t.date]) driverMap[t.driverId].dates[t.date] = [];
                        driverMap[t.driverId].dates[t.date].push(t);
                    });

                    const localCitiesList = settings.localCities.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
                    let finalDrivers = [];
                    const discoveredUpc = new Set();
                    const discoveredOos = new Set();
                    const discoveredEInv = new Set();

                    Object.values(driverMap).forEach(d => {
                        let dTrips = [];
                        Object.keys(d.dates).sort().forEach(dateStr => {
                            const dailyTrips = d.dates[dateStr];
                            dailyTrips.forEach((trip, index) => {
                                const netQty = Math.max(0, trip.qty - trip.totalRet);
                                
                                let dests = trip.destinations;
                                const originCity = getHomeCityFromSite(trip.siteRef);
                                
                                let nonHomeDests = dests.filter(dest => {
                                    const destLower = String(dest).toLowerCase();
                                    if (originCity) {
                                        if (originCity === 'KHAMIS' && destLower.includes('mushayet')) return false;
                                        return !destLower.includes(originCity.toLowerCase());
                                    }
                                    return true;
                                });
                                
                                let evalDests = nonHomeDests.length > 0 ? nonHomeDests : (dests.length > 0 ? dests : ['Unknown']);
                                
                                let isLocal = true;
                                let localAllow = 0, upcAllow = 0, oosAllow = 0, einvoiceAllow = 0, secondAllow = 0;
                                let palletAllow = trip.palletsReturned * settings.palletRate;
                                let otherAllow = trip.isOther ? settings.otherTripRate : 0;
                                
                                let highestRate = -1;
                                let primaryDest = evalDests[0];

                                if (trip.oosType) {
                                    isLocal = false; 
                                    const upperType = trip.oosType.toUpperCase();
                                    const isStrCross = upperType.includes('STR') || upperType.includes('CROSS') || upperType.includes('DOCK');
                                    const isEinv = upperType.includes('EINVOICE') || upperType.includes('E-INV') || upperType.includes('E INVOICE');
                                    
                                    evalDests.forEach(d => {
                                        const destKey = String(d).trim().toUpperCase();
                                        if (isStrCross) {
                                            if (destKey) discoveredOos.add(destKey);
                                            const rate = oosRates[destKey] !== undefined ? oosRates[destKey] : 0;
                                            if (rate > highestRate) { highestRate = rate; primaryDest = d; }
                                        } else if (isEinv) {
                                            if (destKey) discoveredEInv.add(destKey);
                                            const rate = einvoiceRates[destKey] !== undefined ? einvoiceRates[destKey] : 0;
                                            if (rate > highestRate) { highestRate = rate; primaryDest = d; }
                                        }
                                    });

                                    if (isStrCross) oosAllow = Math.max(0, highestRate);
                                    if (isEinv) einvoiceAllow = Math.max(0, highestRate);
                                    
                                    if (index > 0) {
                                        if (trip.tonnage === 20) secondAllow = settings.secondTrip20t;
                                        else if (trip.tonnage >= 7) secondAllow = settings.secondTrip7t10t;
                                        else secondAllow = settings.secondTrip5t;
                                    }
                                } else {
                                    evalDests.forEach(d => {
                                        const finalDestLower = String(d).toLowerCase().trim();
                                        const destKey = String(d).trim().toUpperCase();
                                        
                                        let destIsLocal = true; 
                                        const homeCity = getHomeCityFromSite(trip.siteRef);
                                        
                                        if (homeCity) {
                                            if (finalDestLower.includes(homeCity.toLowerCase()) || (homeCity === 'KHAMIS' && finalDestLower.includes('mushayet'))) {
                                                destIsLocal = true;
                                            } else {
                                                destIsLocal = false;
                                            }
                                        } else {
                                            const tripCityDesc = String(trip.cityDesc || '').toLowerCase();
                                            if (tripCityDesc.includes('upcountry') || tripCityDesc.includes('up country')) destIsLocal = false;
                                            else if (tripCityDesc.includes('local')) destIsLocal = true;
                                            else if (cityClassificationMap[finalDestLower] === 'upcountry') destIsLocal = false;
                                            else if (cityClassificationMap[finalDestLower] === 'local') destIsLocal = true;
                                            else destIsLocal = localCitiesList.some(lc => finalDestLower.includes(lc));
                                        }

                                        if (!destIsLocal) {
                                            isLocal = false; 
                                            if (destKey) discoveredUpc.add(destKey);
                                            const rate = upcountryRates[destKey] !== undefined ? upcountryRates[destKey] : settings.upcountryDefaultRate;
                                            if (rate > highestRate) { highestRate = rate; primaryDest = d; }
                                        }
                                    });

                                    if (isLocal) {
                                        if (netQty < 700) localAllow = netQty * settings.rateUnder700;
                                        else localAllow = settings.rateOver700;
                                    } else {
                                        upcAllow = Math.max(0, highestRate);
                                    }

                                    if (index > 0) {
                                        if (trip.tonnage === 20) secondAllow = settings.secondTrip20t;
                                        else if (trip.tonnage >= 7) secondAllow = settings.secondTrip7t10t;
                                        else secondAllow = settings.secondTrip5t;
                                    }
                                }

                                const tripTotal = localAllow + upcAllow + oosAllow + einvoiceAllow + secondAllow + palletAllow + otherAllow;
                                
                                dTrips.push({
                                    ...trip, netQty, isLocal, pathStr: evalDests.join(' | '), finalDest: primaryDest,
                                    localAllow, upcAllow, oosAllow, einvoiceAllow, secondAllow, palletAllow, otherAllow, tripTotal
                                });
                            });
                        });

                        if (dTrips.length > 0) {
                            finalDrivers.push({ driverId: d.driverId, driverName: d.driverName, trips: dTrips });
                        }
                    });

                    finalDrivers.sort((a, b) => {
                        const sumA = a.trips.reduce((acc, t) => acc + t.tripTotal, 0);
                        const sumB = b.trips.reduce((acc, t) => acc + t.tripTotal, 0);
                        return sumB - sumA;
                    });

                    setDiscoveredDests(Array.from(discoveredUpc).sort());
                    setDiscoveredOOSDests(Array.from(discoveredOos).sort());
                    setDiscoveredEInvoiceDests(Array.from(discoveredEInv).sort());

                    setResults({ originalDrivers: finalDrivers });
                    setExpandedDrivers({});
                    setActiveTab('dashboard');
                } catch (err) {
                    console.error(err);
                    setError('An error occurred during processing. Ensure files are valid.');
                } finally {
                    setIsProcessing(false);
                }
            };

            const displayData = useMemo(() => {
                if (!results) return null;
                const searchLower = searchTerm.toLowerCase().trim();
                
                let drivers = results.originalDrivers.map(d => {
                    const driverMatch = String(d.driverId).toLowerCase().includes(searchLower) || (d.driverName && String(d.driverName).toLowerCase().includes(searchLower));
                    
                    const matchedTrips = d.trips.filter(t => 
                        driverMatch ||
                        (t.tripId && String(t.tripId).toLowerCase().includes(searchLower)) ||
                        (t.orderNo && String(t.orderNo).toLowerCase().includes(searchLower)) ||
                        (t.invoiceNo && String(t.invoiceNo).toLowerCase().includes(searchLower)) ||
                        (t.vehicleType && String(t.vehicleType).toLowerCase().includes(searchLower)) ||
                        (t.vehicleNo && String(t.vehicleNo).toLowerCase().includes(searchLower)) ||
                        (t.date && String(t.date).toLowerCase().includes(searchLower))
                    );

                    const metrics = matchedTrips.reduce((acc, t) => {
                        acc.dLocal += t.localAllow; acc.dUpc += t.upcAllow; 
                        acc.dOos += t.oosAllow; acc.dEinvoice += t.einvoiceAllow;
                        acc.dSecond += t.secondAllow; acc.dPallet += t.palletAllow; 
                        acc.dOther += t.otherAllow; acc.dTotal += t.tripTotal;
                        return acc;
                    }, { dLocal: 0, dUpc: 0, dOos: 0, dEinvoice: 0, dSecond: 0, dPallet: 0, dOther: 0, dTotal: 0 });

                    return { ...d, ...metrics, trips: matchedTrips };
                }).filter(d => d.trips.length > 0);

                const kpis = drivers.reduce((acc, d) => {
                    acc.totalDrivers++;
                    acc.totalTrips += d.trips.length;
                    acc.totalAllowance += d.dTotal;
                    return acc;
                }, { totalDrivers: 0, totalTrips: 0, totalAllowance: 0 });

                let trucksMap = {};
                drivers.forEach(d => {
                    d.trips.forEach(t => {
                        const vNo = t.vehicleNo || t.vehicleType || 'Unknown-Asset';
                        if (!trucksMap[vNo]) {
                            trucksMap[vNo] = {
                                vehicleNo: vNo, vehicleType: t.vehicleType, tonnage: t.tonnage,
                                datesSet: new Set(), trips: [], totalQty: 0, totalPalletsDispatched: 0, totalPalletsReturned: 0, totalAllowance: 0
                            };
                        }
                        trucksMap[vNo].datesSet.add(t.date);
                        trucksMap[vNo].trips.push({...t, driverName: d.driverName, driverId: d.driverId});
                        trucksMap[vNo].totalQty += t.netQty;
                        trucksMap[vNo].totalPalletsDispatched += t.palletsDispatched;
                        trucksMap[vNo].totalPalletsReturned += t.palletsReturned;
                        trucksMap[vNo].totalAllowance += t.tripTotal;
                    });
                });

                let trucks = Object.values(trucksMap)
                    .filter(t => t.trips.length > 0)
                    .map(t => ({ ...t, activeDays: t.datesSet.size, totalTrips: t.trips.length }))
                    .sort((a, b) => b.totalTrips - a.totalTrips);

                trucks.forEach(truck => {
                    const groupedByDate = {};
                    truck.trips.forEach(t => {
                        if (!groupedByDate[t.date]) groupedByDate[t.date] = [];
                        groupedByDate[t.date].push(t);
                    });
                    truck.tripsByDate = Object.keys(groupedByDate).sort().map(date => ({
                        date, trips: groupedByDate[date],
                        dailyQty: groupedByDate[date].reduce((sum, t) => sum + t.netQty, 0),
                        dailyPalletsDispatched: groupedByDate[date].reduce((sum, t) => sum + t.palletsDispatched, 0),
                        dailyPalletsReturned: groupedByDate[date].reduce((sum, t) => sum + t.palletsReturned, 0),
                        dailyAllow: groupedByDate[date].reduce((sum, t) => sum + t.tripTotal, 0)
                    }));
                });

                return { drivers, trucks, kpis };
            }, [results, searchTerm]);

            const exportToExcel = () => {
                if (!displayData) return;
                
                const applyPremiumStyling = (ws) => {
                    const range = window.XLSX.utils.decode_range(ws['!ref']);
                    const colWidths = [];
                    for(let R = range.s.r; R <= range.e.r; ++R) {
                        for(let C = range.s.c; C <= range.e.c; ++C) {
                            const address = window.XLSX.utils.encode_cell({r: R, c: C});
                            if(!ws[address]) continue;
                            const valStr = String(ws[address].v || '');
                            colWidths[C] = Math.max(colWidths[C] || 12, valStr.length);
                        }
                    }
                    ws['!cols'] = colWidths.map(w => ({ wch: Math.min(Math.max(w + 2, 12), 40) }));

                    for(let R = range.s.r; R <= range.e.r; ++R) {
                        for(let C = range.s.c; C <= range.e.c; ++C) {
                            const address = window.XLSX.utils.encode_cell({r: R, c: C});
                            if(!ws[address]) continue;

                            let cellStyle = { 
                                font: { name: 'Arial', sz: 10 },
                                alignment: { vertical: "center" },
                                border: { top: { style: 'thin', color: { rgb: "E2E8F0" } }, bottom: { style: 'thin', color: { rgb: "E2E8F0" } }, left: { style: 'thin', color: { rgb: "E2E8F0" } }, right: { style: 'thin', color: { rgb: "E2E8F0" } } }
                            };

                            if(R === 0) {
                                cellStyle = { font: { name: 'Arial', sz: 11, bold: true, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "1E293B" } }, alignment: { horizontal: "center", vertical: "center" } };
                            } else {
                                if(typeof ws[address].v === 'number') {
                                    if(ws[address].v % 1 !== 0 || ws[address].v > 999) { cellStyle.numFmt = "#,##0.00"; cellStyle.alignment = { horizontal: "right" }; } 
                                    else { cellStyle.numFmt = "#,##0"; cellStyle.alignment = { horizontal: "center" }; }
                                }
                                if (R % 2 !== 0) cellStyle.fill = { fgColor: { rgb: "F8FAFC" } }; 
                            }
                            ws[address].s = cellStyle;
                        }
                    }
                };

                const summaryData = [
                    { "Metric": "Total Active Drivers", "Value": displayData.kpis.totalDrivers },
                    { "Metric": "Total Valid Processed Trips", "Value": displayData.kpis.totalTrips },
                    { "Metric": "Total Allowance Calculated (SAR)", "Value": displayData.kpis.totalAllowance }
                ];
                const wsExec = window.XLSX.utils.json_to_sheet(summaryData);
                applyPremiumStyling(wsExec);

                const driverSummaryData = displayData.drivers.map(d => ({
                    'Driver ID': d.driverId, 'Driver Name': d.driverName, 'Total Trips': d.trips.length,
                    'Local Allowance': d.dLocal, 'Upcountry Allowance': d.dUpc,
                    'OOS STR/Crossdock Allowance': d.dOos, 'E-Invoice Allowance': d.dEinvoice,
                    '2nd Trip Allowance': d.dSecond, 'Pallet Allowance': d.dPallet, 'Other Allowance': d.dOther,
                    'Total Allowance (SAR)': d.dTotal
                }));
                const wsDriver = window.XLSX.utils.json_to_sheet(driverSummaryData);
                applyPremiumStyling(wsDriver);

                const truckSummaryData = displayData.trucks.map(t => ({
                    'Vehicle Number': t.vehicleNo, 'Vehicle Type': t.vehicleType, 'Tonnage': t.tonnage,
                    'Active Days': t.activeDays, 'Total Trips': t.totalTrips, 'Total Net Cases Delivered': t.totalQty,
                    'Total Pallets Dispatched': t.totalPalletsDispatched, 'Total Returned Pallets': t.totalPalletsReturned,
                    'Allowances Generated (SAR)': t.totalAllowance
                }));
                const wsTruck = window.XLSX.utils.json_to_sheet(truckSummaryData);
                applyPremiumStyling(wsTruck);

                const detailedData = [];
                const oosSpecificData = []; 

                displayData.drivers.forEach(d => {
                    d.trips.forEach(t => {
                        const rowData = {
                            'Date': t.date, 'Driver ID': d.driverId, 'Driver Name': d.driverName,
                            'Source Data': t.source, 'OOS Scope Type': t.oosType || 'N/A', 'Trip Card / ID': t.tripId, 
                            'Order Number': t.orderNo, 'Invoice Number': t.invoiceNo, 'Final Status': t.status,
                            'Vehicle Type': t.vehicleType, 'Vehicle Number': t.vehicleNo, 'Tonnage': t.tonnage,
                            'Destinations': t.pathStr, 'Original Qty': t.originalQty, 'Adjusted/Split Qty': t.qty,
                            'Returned Cases': t.retCases, 'Partial Return Qty': t.partialRetCases, 'Net Payable Qty': t.netQty,
                            'Pallets Dispatched': t.palletsDispatched, 'Pallets Returned': t.palletsReturned,
                            'Local Allow (SAR)': t.localAllow, 'Upc Allow (SAR)': t.upcAllow,
                            'OOS Allow (SAR)': t.oosAllow, 'E-Inv Allow (SAR)': t.einvoiceAllow,
                            '2nd Trip Allow (SAR)': t.secondAllow, 'Pallet Allow (SAR)': t.palletAllow,
                            'STR/Other Allow (SAR)': t.otherAllow, 'Total Trip Value (SAR)': t.tripTotal
                        };
                        detailedData.push(rowData);
                        
                        if (t.source === 'OOS' || t.oosType) {
                            oosSpecificData.push(rowData);
                        }
                    });
                });

                const wsDetail = window.XLSX.utils.json_to_sheet(detailedData);
                applyPremiumStyling(wsDetail);
                
                const wsOos = window.XLSX.utils.json_to_sheet(oosSpecificData);
                applyPremiumStyling(wsOos);
                
                const wb = window.XLSX.utils.book_new();
                window.XLSX.utils.book_append_sheet(wb, wsExec, "Executive Summary");
                window.XLSX.utils.book_append_sheet(wb, wsDriver, "Driver Ledger");
                window.XLSX.utils.book_append_sheet(wb, wsTruck, "Truck Analysis");
                window.XLSX.utils.book_append_sheet(wb, wsDetail, "Detailed Raw Data");
                window.XLSX.utils.book_append_sheet(wb, wsOos, "Out of Scope Data"); 
                
                window.XLSX.writeFile(wb, `Logistics_Allowance_Dashboard_${new Date().toISOString().split('T')[0]}.xlsx`);
            };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 font-sans p-6 pb-20">
                    <div className="max-w-[1400px] mx-auto space-y-6">
                        
                        <header className="flex flex-col md:flex-row justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <div>
                                <h1 className="text-2xl font-bold text-slate-900 flex items-center gap-3">
                                    <div className="bg-blue-100 p-2 rounded-lg text-blue-700"><Truck size={28} /></div>
                                    Logistics Allowance Engine
                                </h1>
                                <p className="text-slate-500 mt-1 font-medium text-sm">DDR, TMS & Out of Scope Processing • Deduplication</p>
                            </div>

                                                                                            <td className="px-3 py-2">
                                                                                                <div className="flex items-center gap-2 mb-1">
                                                                                                    <span className={`px-1.5 py-0.5 rounded text-[10px] font-bold ${trip.source === 'DDR' ? 'bg-indigo-500/20 text-indigo-300' : trip.source === 'OOS' ? 'bg-amber-500/20 text-amber-300' : 'bg-emerald-500/20 text-emerald-300'}`}>{trip.source}</span>
                                                                                                    <span className="text-[10px] font-bold">{trip.tonnage}T</span>
                                                                                                </div>
                                                                                                <div className="text-[10px] text-slate-400">{trip.vehicleNo || trip.vehicleType}</div>
                                                                                            </td>
                                                                                            <td className="px-3 py-2">
                                                                                                <div className="flex flex-col gap-1">
                                                                                                    {trip.oosType && <span className="text-[9px] font-bold text-amber-400">{trip.oosType}</span>}
                                                                                                    <span className="truncate max-w-[200px]" title={trip.finalDest}>{trip.finalDest}</span>
                                                                                                </div>
                                                                                            </td>
                                                                                            <td className="px-3 py-2 text-right font-bold text-white">{trip.netQty}</td>
                                                                                            <td className="px-3 py-2 text-right">
                                                                                                <span className="text-slate-400">{trip.palletsDispatched}</span>
                                                                                                <span className="text-slate-500 mx-1">/</span>
                                                                                                <span className="text-purple-400 font-bold">{trip.palletsReturned}</span>
                                                                                            </td>
                                                                                            <td className="px-3 py-2 text-right">
                                                                                                <div className="flex justify-end gap-1 flex-wrap max-w-[200px]">
                                                                                                    {trip.localAllow > 0 && <span className="bg-emerald-900/40 text-emerald-300 px-1 py-0.5 rounded border border-emerald-800/50">L:{trip.localAllow.toFixed(0)}</span>}
                                                                                                    {trip.upcAllow > 0 && <span className="bg-blue-900/40 text-blue-300 px-1 py-0.5 rounded border border-blue-800/50">U:{trip.upcAllow.toFixed(0)}</span>}
                                                                                                    {trip.oosAllow > 0 && <span className="bg-amber-900/40 text-amber-300 px-1 py-0.5 rounded border border-amber-800/50">OOS:{trip.oosAllow.toFixed(0)}</span>}
                                                                                                    {trip.einvoiceAllow > 0 && <span className="bg-purple-900/40 text-purple-300 px-1 py-0.5 rounded border border-purple-800/50">E:{trip.einvoiceAllow.toFixed(0)}</span>}
                                                                                                    {trip.secondAllow > 0 && <span className="bg-indigo-900/40 text-indigo-300 px-1 py-0.5 rounded border border-indigo-800/50">2:{trip.secondAllow.toFixed(0)}</span>}
                                                                                                    {trip.palletAllow > 0 && <span className="bg-pink-900/40 text-pink-300 px-1 py-0.5 rounded border border-pink-800/50">P:{trip.palletAllow.toFixed(0)}</span>}
                                                                                                    {trip.otherAllow > 0 && <span className="bg-rose-900/40 text-rose-300 px-1 py-0.5 rounded border border-rose-800/50">S:{trip.otherAllow.toFixed(0)}</span>}
                                                                                                    <span className="font-black text-white w-full mt-0.5">{trip.tripTotal.toFixed(1)}</span>
                                                                                                </div>
                                                                                            </td>
                                                                                        </tr>
                                                                                    ))}
                                                                                </tbody>
                                                                            </table>
                                                                        </div>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        )}
                                                    </Fragment>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}

                                {activeTab === 'trucks' && (
                                    <div className="overflow-x-auto animate-fade-in w-full">
                                        <table className="w-full text-left text-sm whitespace-nowrap">
                                            <thead className="bg-slate-100 text-slate-600 text-[11px] uppercase font-bold tracking-wider">
                                                <tr>
                                                    <th className="px-6 py-4">Truck Details</th>
                                                    <th className="px-6 py-4 text-center">Active Days</th>
                                                    <th className="px-6 py-4 text-center">Total Trips</th>
                                                    <th className="px-6 py-4 text-right">Net Cases</th>
                                                    <th className="px-6 py-4 text-right">Disp. PLT</th>
                                                    <th className="px-6 py-4 text-right text-purple-600">Ret. PLT (Payable)</th>
                                                    <th className="px-6 py-4 text-right text-slate-900 bg-slate-200/50">Allowances (SAR)</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 text-slate-700">
                                                {displayData.trucks.map((truck) => (
                                                    <Fragment key={truck.vehicleNo}>
                                                        <tr className="hover:bg-slate-50 transition-colors cursor-pointer group" onClick={() => toggleTruck(truck.vehicleNo)}>
                                                            <td className="px-6 py-4 flex items-center gap-3">
                                                                <div className="text-slate-400 group-hover:text-blue-500"><ChevronDown size={20}/></div>
                                                                <div>
                                                                    <div className="font-bold text-slate-900 text-base">{truck.vehicleNo}</div>
                                                                    <div className="text-xs text-slate-500 font-mono mt-0.5">{truck.tonnage}T • {truck.vehicleType || 'N/A'}</div>
                                                                </div>
                                                            </td>
                                                            <td className="px-6 py-4 text-center"><span className="bg-amber-100 text-amber-800 py-1 px-3 rounded-full text-xs font-bold">{truck.activeDays} Days</span></td>
                                                            <td className="px-6 py-4 text-center"><span className="bg-blue-100 text-blue-800 py-1 px-3 rounded-full text-xs font-bold">{truck.totalTrips} Trips</span></td>
                                                            <td className="px-6 py-4 text-right font-black text-emerald-600">{truck.totalQty.toLocaleString(undefined, {maximumFractionDigits:1})} CS</td>
                                                            <td className="px-6 py-4 text-right font-bold text-slate-500">{truck.totalPalletsDispatched.toLocaleString()} PLT</td>
                                                            <td className="px-6 py-4 text-right font-black text-purple-600">{truck.totalPalletsReturned.toLocaleString()} PLT</td>
                                                            <td className="px-6 py-4 text-right font-black text-slate-900 bg-slate-50 text-base">{truck.totalAllowance.toFixed(2)}</td>
                                                        </tr>
                                                    </Fragment>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
